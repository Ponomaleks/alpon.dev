<!doctype html><html><head><meta charset="utf-8">
<!-- render: python script in README of tools; styles copied with relative font paths -->
<link rel="stylesheet" href="_styles.local.css">
<style>
  html,body{margin:0}
  .og{width:1200px;height:630px;position:relative;overflow:hidden;isolation:isolate;background:#24493D;color:#EEF2EE;font-family:var(--sans);padding:84px 88px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  .og .hero__contours{width:1500px;right:-560px;top:-430px}
  .og .n{font-size:92px;font-weight:600;line-height:.98;letter-spacing:-.02em;margin:0}
  .og .r{margin-top:26px;font-size:32px;font-weight:500;line-height:1.3}
  .og .r span{color:#BFD3C9;font-weight:400}
  .og .b{display:flex;justify-content:space-between;align-items:end;font-family:var(--mono);font-size:26px;color:#BFD3C9}
  .og .b strong{color:#EEF2EE;font-weight:500}
  .icon{width:180px;height:180px;background:#24493D;position:relative;overflow:hidden;isolation:isolate;display:grid;place-items:center;color:#EEF2EE;font:600 78px/1 var(--sans);letter-spacing:-.03em}
  .icon .hero__contours{width:560px;right:-300px;top:-150px}
</style></head><body>
<div class="og" id="og">
  <div class="hero__contours" style="background-image:url(../public/img/contours.svg)"></div>
  <div><p class="n">Alexander<br>Ponomarenko</p><p class="r">Software Engineer<br><span>Full Stack Developer</span></p></div>
  <div class="b"><strong>alpon.dev</strong><span>Oslo, Norge</span></div>
</div>
<div class="icon" id="icon"><div class="hero__contours" style="background-image:url(contours-icon.svg)"></div></div>
</body></html>
