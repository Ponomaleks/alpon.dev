name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint (tokens check, contrast, astro check, eslint, prettier, stylelint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Budgets (bootstrap, initial JS, font preloads, font files)
        run: npm run check:budgets

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The fallback-face e2e and mobile Lighthouse must exercise the metric-matched Roboto fallback,
      # as on Android: install Roboto and make sure no Arial is present (fjord-foundation sad §11).
      - name: Fonts for the fallback checks (Roboto only, no Arial)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-roboto
          fc-list : file family | grep -i arial | cut -d: -f1 | xargs -r sudo rm -f
          sudo fc-cache -f
          echo "Roboto:"; fc-list : family | grep -i "^roboto" | sort -u | head -3
          if fc-list : family | grep -qi "arial"; then echo "Arial is still installed" >&2; exit 1; fi
          echo "Arial: none"

      - name: Test (Playwright e2e + axe)
        run: npm run test

      # Visual baselines are Linux-only (fjord-foundation sad §11). While none are committed, write
      # them here and upload them for review; once committed, the Test step compares against them.
      - name: Visual baselines (written only while none are committed)
        id: baselines
        if: hashFiles('tests/visual/__screenshots__/linux/**') == ''
        continue-on-error: true
        env:
          FJORD_VISUAL_BASELINES: write
        run: npx playwright test tests/visual --project desktop --update-snapshots=missing

      - name: Upload visual baselines
        if: steps.baselines.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/visual/__screenshots__/linux/
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Lighthouse CI
        run: npm run lhci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7
