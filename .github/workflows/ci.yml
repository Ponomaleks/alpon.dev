name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Branch protection on v2 and main requires the checks `check` and `visual`: the job ids below
# (commands in docs/features/fjord-foundation/tasks/t16-ci-lighthouse-protection.md). Keep both
# jobs free of path filters (`paths` / `paths-ignore` under `on:`) and of job-level `if:`
# conditions on PRs into v2/main: a required check that never reports blocks the merge forever.
# Renaming a job id or giving a job a `name:` changes its check name; update the protection with it.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint (tokens check, contrast, astro check, eslint, prettier, stylelint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Budgets (bootstrap, initial JS, font preloads, font files)
        run: npm run check:budgets

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The fallback-face e2e and mobile Lighthouse must exercise the metric-matched Roboto fallback,
      # as on Android: install Roboto and make sure no Arial is present (fjord-foundation sad §11).
      - name: Fonts for the fallback checks (Roboto only, no Arial)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-roboto
          fc-list : file family | grep -i arial | cut -d: -f1 | xargs -r sudo rm -f
          sudo fc-cache -f
          echo "Roboto:"; fc-list : family | grep -i "^roboto" | sort -u | head -3
          if fc-list : family | grep -qi "arial"; then echo "Arial is still installed" >&2; exit 1; fi
          echo "Arial: none"

      - name: Test (Playwright e2e + axe)
        run: npm run test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Against wrangler dev on dist/, so the delivered headers apply while pages are scored.
      - name: Lighthouse CI
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npm run lhci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 7

  # Visual regression runs in the official Playwright image, the same environment the manual
  # "Visual baselines" workflow writes the baselines in (fjord-foundation sad §11). A missing
  # baseline fails this job.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Visual regression (Not-found, 390 / 834 / 1440 × Dag / Natt)
        env:
          FJORD_VISUAL: compare
        run: npx playwright test tests/visual --project desktop

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7
