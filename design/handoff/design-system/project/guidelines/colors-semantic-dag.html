<!-- @dsCard group="Colors" viewport="700x250" name="Semantic · Dag" subtitle="--fjord-color-* in the Dag theme" -->
<!doctype html><html lang="en" data-theme="dag"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--fjord-color-bg);color:var(--fjord-color-text);box-sizing:border-box}.m{font:400 11px/1.35 var(--fjord-font-mono);color:var(--fjord-color-text-muted)}.k{font:500 11px/1.35 var(--fjord-font-mono);color:var(--fjord-color-text)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px}.r{display:flex;gap:10px;align-items:center}.s{width:34px;height:34px;border-radius:6px;border:1px solid var(--fjord-color-border);flex:none}</style></head><body><div class="g"><div class="r"><div class="s" style="background:var(--fjord-color-bg)"></div><div><div class="k">bg</div><div class="m" data-v="--fjord-color-bg"></div></div></div><div class="r"><div class="s" style="background:var(--fjord-color-bg-raised)"></div><div><div class="k">bg-raised</div><div class="m" data-v="--fjord-color-bg-raised"></div></div></div><div class="r"><div class="s" style="background:var(--fjord-color-bg-sunken)"></div><div><div class="k">bg-sunken</div><div class="m" data-v="--fjord-color-bg-sunken"></div></div></div><div class="r"><div class="s" style="background:var(--fjord-color-bg-inverse)"></div><div><div class="k">bg-inverse</div><div class="m" data-v="--fjord-color-bg-inverse"></div></div></div><div class="r"><div class="s" style="background:var(--fjord-color-text)"></div><div><div class="k">text</div><div class="m" data-v="--fjord-color-text"></div></div></div><div class="r"><div class="s" style="background:var(--fjord-color-text-muted)"></div><div><div class="k">text-muted</div><div class="m" data-v="--fjord-color-text-muted"></div></div></div><div class="r"><div class="s" style="background:var(--fjord-color-link)"></div><div><div class="k">link</div><div class="m" data-v="--fjord-color-link"></div></div></div><div class="r"><div class="s" style="background:var(--fjord-color-link-hover)"></div><div><div class="k">link-hover</div><div class="m" data-v="--fjord-color-link-hover"></div></div></div><div class="r"><div class="s" style="background:var(--fjord-color-focus-ring)"></div><div><div class="k">focus-ring</div><div class="m" data-v="--fjord-color-focus-ring"></div></div></div><div class="r"><div class="s" style="background:var(--fjord-color-border)"></div><div><div class="k">border</div><div class="m" data-v="--fjord-color-border"></div></div></div><div class="r"><div class="s" style="background:var(--fjord-color-border-strong)"></div><div><div class="k">border-strong</div><div class="m" data-v="--fjord-color-border-strong"></div></div></div><div class="r"><div class="s" style="background:var(--fjord-color-contour-line)"></div><div><div class="k">contour-line</div><div class="m" data-v="--fjord-color-contour-line"></div></div></div><div class="r"><div class="s" style="background:var(--fjord-color-selection)"></div><div><div class="k">selection</div><div class="m" data-v="--fjord-color-selection"></div></div></div><div class="r"><div class="s" style="background:var(--fjord-color-cta-bg)"></div><div><div class="k">cta-bg</div><div class="m" data-v="--fjord-color-cta-bg"></div></div></div><div class="r"><div class="s" style="background:var(--fjord-color-cta-text)"></div><div><div class="k">cta-text</div><div class="m" data-v="--fjord-color-cta-text"></div></div></div><div class="r"><div class="s" style="background:var(--fjord-color-cta-hover)"></div><div><div class="k">cta-hover</div><div class="m" data-v="--fjord-color-cta-hover"></div></div></div></div><script>document.querySelectorAll('[data-v]').forEach(e=>e.textContent=getComputedStyle(document.documentElement).getPropertyValue(e.dataset.v).trim().toUpperCase())</script></body></html>
