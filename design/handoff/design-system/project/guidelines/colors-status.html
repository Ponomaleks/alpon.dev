<!-- @dsCard group="Colors" viewport="700x150" name="Status colours" subtitle="Desaturated success / warning / danger, per theme" -->
<!doctype html><html lang="en" data-theme="dag"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--fjord-color-bg);color:var(--fjord-color-text);box-sizing:border-box}.m{font:400 11px/1.35 var(--fjord-font-mono);color:var(--fjord-color-text-muted)}.k{font:500 11px/1.35 var(--fjord-font-mono);color:var(--fjord-color-text)}.w{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:-20px -24px;height:150px}.p{padding:20px 24px;display:flex;gap:14px}.c{flex:1;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}</style></head><body><div class="w"><div class="p" data-theme="dag" style="background:var(--fjord-color-bg)"><div class="c" style="background:var(--fjord-color-success-soft)"><span style="font:600 15px/1.2 var(--fjord-font-sans);color:var(--fjord-color-success)">success</span><span class="m">--fjord-color-success</span></div><div class="c" style="background:var(--fjord-color-warning-soft)"><span style="font:600 15px/1.2 var(--fjord-font-sans);color:var(--fjord-color-warning)">warning</span><span class="m">--fjord-color-warning</span></div><div class="c" style="background:var(--fjord-color-danger-soft)"><span style="font:600 15px/1.2 var(--fjord-font-sans);color:var(--fjord-color-danger)">danger</span><span class="m">--fjord-color-danger</span></div></div><div class="p" data-theme="natt" style="background:var(--fjord-color-bg)"><div class="c" style="background:var(--fjord-color-success-soft)"><span style="font:600 15px/1.2 var(--fjord-font-sans);color:var(--fjord-color-success)">success</span><span class="m">--fjord-color-success</span></div><div class="c" style="background:var(--fjord-color-warning-soft)"><span style="font:600 15px/1.2 var(--fjord-font-sans);color:var(--fjord-color-warning)">warning</span><span class="m">--fjord-color-warning</span></div><div class="c" style="background:var(--fjord-color-danger-soft)"><span style="font:600 15px/1.2 var(--fjord-font-sans);color:var(--fjord-color-danger)">danger</span><span class="m">--fjord-color-danger</span></div></div></div></body></html>
