<style>body{margin:0;padding:20px 24px;background:var(--fjord-color-bg);color:var(--fjord-color-text);box-sizing:border-box}.m{font:400 11px/1.35 var(--fjord-font-mono);color:var(--fjord-color-text-muted)}.k{font:500 11px/1.35 var(--fjord-font-mono);color:var(--fjord-color-text)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.t{height:110px;border-radius:8px;padding:14px;box-sizing:border-box;position:relative;overflow:hidden;border:1px solid var(--fjord-color-border)}.l{margin-top:8px;font:500 11px/1.3 var(--fjord-font-mono)}.ok{color:var(--fjord-color-success)}.no{color:var(--fjord-color-danger)}</style></head><body><div class="g">

</div></body></html>
