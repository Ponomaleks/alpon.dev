<!-- @dsCard group="Motion" viewport="700x220" name="Durations & easing" subtitle="Hover the rows · fjord-out decelerates, fjord-in-out for cross-fades" -->
<!doctype html><html lang="en" data-theme="dag"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 24px;background:var(--fjord-color-bg);color:var(--fjord-color-text);box-sizing:border-box}.m{font:400 11px/1.35 var(--fjord-font-mono);color:var(--fjord-color-text-muted)}.k{font:500 11px/1.35 var(--fjord-font-mono);color:var(--fjord-color-text)}.r{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;height:30px}.trk{position:relative;height:2px;background:var(--fjord-color-border)}.dot{position:absolute;left:0;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--fjord-color-link)}body:hover .dot{left:calc(100% - 12px)}</style></head><body><div class="r"><div><span class="k">duration-120</span> <span class="m">press, colour</span></div><div class="trk"><div class="dot" style="transition:left 120ms var(--fjord-ease-out)"></div></div></div><div class="r"><div><span class="k">duration-200</span> <span class="m">hover, underline</span></div><div class="trk"><div class="dot" style="transition:left 200ms var(--fjord-ease-out)"></div></div></div><div class="r"><div><span class="k">duration-320</span> <span class="m">reveal, sheet, toast</span></div><div class="trk"><div class="dot" style="transition:left 320ms var(--fjord-ease-out)"></div></div></div><div class="r"><div><span class="k">duration-560</span> <span class="m">page transition</span></div><div class="trk"><div class="dot" style="transition:left 560ms var(--fjord-ease-in-out)"></div></div></div><div class="r"><div><span class="k">duration-1200</span> <span class="m">stat count-up</span></div><div class="trk"><div class="dot" style="transition:left 1200ms var(--fjord-ease-out)"></div></div></div><div class="m" style="margin-top:10px">--fjord-ease-out: cubic-bezier(0.2, 0.8, 0.2, 1) · --fjord-ease-in-out: cubic-bezier(0.65, 0, 0.35, 1)</div></body></html>
