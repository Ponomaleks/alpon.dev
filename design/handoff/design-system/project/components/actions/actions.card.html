</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { Button, IconButton, TextLink } = window.FjordDesignSystem_44c954;
function App(){return <div className="panes"><Pane t="dag"/><Pane t="natt"/></div>}
function Pane({t}){return <div className="pane" data-theme={t}><div className="lbl">{t==='dag'?'DAG':'NATT'}</div>
<div className="lbl">PRIMARY · default / hover / focus / active / disabled</div>
<div className="row"><Button arrow>Get in touch</Button><Button arrow className="is-hover">Get in touch</Button></div>
<div className="row"><Button className="is-focus">Focus</Button><Button className="is-active">Pressed</Button><Button disabled>Disabled</Button><Button loading>Sending…</Button></div>
<div className="lbl">SECONDARY · GHOST</div>
<div className="row"><Button variant="secondary" icon="file-down">Download PDF</Button><Button variant="secondary" className="is-hover">Hover</Button></div>
<div className="row"><Button variant="ghost" arrow>View CV</Button><Button variant="ghost" className="is-hover">Hover</Button><Button variant="ghost" disabled>Disabled</Button></div>

<div className="row"><Button size="sm">Small</Button><Button size="lg" arrow>Large</Button><IconButton icon="menu" label="Menu"/><IconButton icon="sun" label="Theme" variant="secondary"/><IconButton icon="x" label="Close" className="is-focus"/><IconButton icon="copy" label="Copy" disabled/></div>
<div className="lbl">LINKS</div>
<p style={{margin:0,fontSize:15,lineHeight:1.6}}>Read the <TextLink href="#">case study</TextLink> or the <TextLink href="#" className="is-hover">notes</TextLink>.</p>
<div className="row" style={{gap:20}}><TextLink variant="standalone">All projects</TextLink><TextLink variant="external" mono>github.com/ponomaleks</TextLink></div></div>}
